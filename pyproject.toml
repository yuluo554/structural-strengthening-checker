[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-strengthening-checker"
version = "0.1.0"
description = "结构加固验算与加固方案核查工具：GB 50367-2013 构件加固验算计算器 + 加固方案文本规则核查 + GB 55021-2021 强制条款检查单（全离线，条款联动可溯源）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "structural-strengthening-checker contributors" }]
keywords = [
    "structural-engineering",
    "strengthening",
    "retrofit",
    "GB50367",
    "GB55021",
    "compliance-check",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# 核心层零依赖：公式引擎/规则引擎/检查单/CLI/基准（规则通路）全部 stdlib
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.2"]
report = ["python-docx>=0.8.11"]
parse = ["python-docx>=0.8.11", "pypdf>=3.0"]
dev = ["pytest>=7.0"]
package = ["pyinstaller>=5.0"]

[project.scripts]
ssc = "structural_strengthening_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
