name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 矩阵：本机唯一解释器为 3.8.8，防新语法混入（ubuntu-24.04 无 3.8，锁 22.04）
          # extras 列：windows/3.8 矩阵加装 gui（M5 起 GUI 测试常驻一个矩阵，offscreen 运行），
          # 其余矩阵不装 PySide6——test_gui importorskip 自动跳过
          - { os: ubuntu-22.04, python-version: "3.8", extras: dev }
          - { os: ubuntu-latest, python-version: "3.12", extras: dev }
          - { os: windows-latest, python-version: "3.8", extras: "dev,gui" }
          - { os: windows-latest, python-version: "3.12", extras: dev }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .[${{ matrix.extras }}]
      - name: Tests
        run: python -X utf8 -m pytest
      - name: Selfcheck (CLI + 数据 schema 守门)
        run: python -X utf8 -m structural_strengthening_checker selfcheck
      # M4 起基准常驻 CI：验算真值比对 + 方案核查指标门槛（检出率 1.0 / 误报 0 / 判定准确率 1.0）
      - name: Bench (calc + check 达标门)
        run: python -X utf8 -m structural_strengthening_checker bench
